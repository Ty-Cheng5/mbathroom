<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The ?v=2 on the end is a trick to beat caching. Browsers hold onto favicons
         very stubbornly, so changing this number makes the browser treat it as a
         brand new file and fetch it again. Bump it if the icon ever goes stale. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Montserrat:wght@700&display=swap"
      rel="stylesheet"
    />
    <title>M-Bathroom: Rate your Bathrooms - Real Time Feedback</title>
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
